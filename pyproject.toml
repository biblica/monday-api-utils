[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "monday-api-utils"
version = "0.0.1"
description = "Utilities for using monday.com's GraphQL API"
dependencies = ["pandas", "requests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
